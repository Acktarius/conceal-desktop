name: macOS ARM64

on:
  push:
    tags:
      - "*"

jobs:
  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install boost qt@5

      - name: Clone conceal-core
        run: |
          rm -rf cryptonote
          git clone https://github.com/ConcealNetwork/conceal-core.git cryptonote

      - name: Patch cryptonote for macOS ARM64
        run: |
          python3 - <<'EOF'
          import re, sys

          # hw_detect.hpp: wrap Linux-only headers with #ifdef __linux__
          path = 'cryptonote/src/crypto/pow_hash/hw_detect.hpp'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace(
              '#include <asm/hwcap.h>\n#include <sys/auxv.h>',
              '#ifdef __linux__\n#include <asm/hwcap.h>\n#include <sys/auxv.h>\n#endif // __linux__'
          )
          with open(path, 'w') as f:
              f.write(content)

          # cn_slow_hash.hpp: replace the HAS_ARM_HW hw_check_aes() body using regex
          # (whitespace-agnostic to handle any indentation style in the source)
          path = 'cryptonote/src/crypto/pow_hash/cn_slow_hash.hpp'
          with open(path, 'r') as f:
              content = f.read()
          patched, n = re.subn(
              r'(\s*)return\s*\(getauxval\(AT_HWCAP\)\s*&\s*HWCAP_AES\)\s*!=\s*0\s*;',
              '\n#ifdef __linux__\n\\1return (getauxval(AT_HWCAP) & HWCAP_AES) != 0;\n#else\n\\1return true; // Apple Silicon always has AES hardware\n#endif',
              content
          )
          if n == 0:
              print("ERROR: cn_slow_hash.hpp pattern not found", file=sys.stderr)
              sys.exit(1)
          with open(path, 'w') as f:
              f.write(patched)

          # asm.s is x86-64 only; on ARM64 macOS the system libsystem_platform
          # already provides _setmcontext/_getmcontext for ucontext functions
          import os
          asm = 'cryptonote/src/Platform/OSX/System/asm.s'
          if os.path.exists(asm):
              os.remove(asm)
              print(f"Removed {asm} (x86-64 only, system provides ARM64 equivalent)")

          print("Patches applied successfully.")
          EOF

      - name: Build
        id: build
        run: |
          export PATH="/opt/homebrew/opt/qt@5/bin:$PATH"
          build_folder="build/release"
          ccx_version=$(echo ${{ github.ref }} | sed 's|refs/tags/||')
          release_name="ccx-desktop-macOS-arm64-$ccx_version"
          app_name="conceal-desktop.app"

          lrelease src/languages/*.ts
          mkdir -p "$build_folder"
          cd "$build_folder"
          cmake ../.. -DCMAKE_BUILD_TYPE=Release -DBOOST_ROOT="$(brew --prefix boost)" -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)"
          make -j3
          macdeployqt "$app_name"
          cpack
          mkdir "$release_name"
          mv *.dmg "$release_name".dmg
          zip "$release_name".zip "$release_name".dmg
          sha256=$(shasum -a 256 "$release_name".zip | awk '{ print toupper($1) }')

          echo "sha256=${sha256}" >> $GITHUB_OUTPUT
          echo "release_name=${release_name}.zip" >> $GITHUB_OUTPUT
          echo "asset_path=${build_folder}/${release_name}.zip" >> $GITHUB_OUTPUT
          echo "ccx_version=${ccx_version}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.build.outputs.asset_path }}
          name: Conceal Desktop v${{ steps.build.outputs.ccx_version }}
          body: |
            [Download for macOS ARM64](../../releases/download/${{ steps.build.outputs.ccx_version }}/${{ steps.build.outputs.release_name }}) **${{ steps.build.outputs.release_name }}**
            `SHA256 : ${{ steps.build.outputs.sha256 }}`
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
