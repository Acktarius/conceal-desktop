name: macOS ARM64

on:
  push:
    tags:
      - "*"

jobs:
  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install boost qt@5

      - name: Clone conceal-core
        run: |
          rm -rf cryptonote
          git clone https://github.com/ConcealNetwork/conceal-core.git cryptonote

      - name: Patch cryptonote for macOS ARM64
        run: |
          python3 - <<'EOF'
          import re, sys, os

          # ── 1. hw_detect.hpp: wrap Linux-only headers with #ifdef __linux__ ──
          path = 'cryptonote/src/crypto/pow_hash/hw_detect.hpp'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace(
              '#include <asm/hwcap.h>\n#include <sys/auxv.h>',
              '#ifdef __linux__\n#include <asm/hwcap.h>\n#include <sys/auxv.h>\n#endif // __linux__'
          )
          with open(path, 'w') as f:
              f.write(content)

          # ── 2. cn_slow_hash.hpp: replace getauxval() with always-true on ARM macOS ──
          path = 'cryptonote/src/crypto/pow_hash/cn_slow_hash.hpp'
          with open(path, 'r') as f:
              content = f.read()
          patched, n = re.subn(
              r'(\s*)return\s*\(getauxval\(AT_HWCAP\)\s*&\s*HWCAP_AES\)\s*!=\s*0\s*;',
              '\n#ifdef __linux__\n\\1return (getauxval(AT_HWCAP) & HWCAP_AES) != 0;\n#else\n\\1return true; // Apple Silicon always has AES hardware\n#endif',
              content
          )
          if n == 0:
              print("ERROR: cn_slow_hash.hpp pattern not found", file=sys.stderr)
              sys.exit(1)
          with open(path, 'w') as f:
              f.write(patched)

          # ── 3. Replace x86-64 Platform/OSX/System files with ARM64 equivalents ──
          platform = 'cryptonote/src/Platform/OSX/System'

          # Context.h — ARM64 mcontext/ucontext layout
          with open(f'{platform}/Context.h', 'w') as f:
              f.write("""\
#pragma once

#define setcontext(u) setmcontext(&(u)->uc_mcontext)
#define getcontext(u) getmcontext(&(u)->uc_mcontext)

#ifdef __cplusplus
extern "C" {
#endif
#include <signal.h>

typedef struct mcontext mctx;
typedef struct ucontext uctx;

extern int  swapcontext(uctx*, const uctx*);
extern void makecontext(uctx*, void(*)(void), intptr_t);
extern int  getmcontext(mctx*);
extern void setmcontext(const mctx*);

/* ARM64 machine context — offsets used directly in asm.s */
struct mcontext {
    long mc_x0;    /* offset   0 — function arg / restoration return value */
    long mc_x19;   /* offset   8 */
    long mc_x20;   /* offset  16 */
    long mc_x21;   /* offset  24 */
    long mc_x22;   /* offset  32 */
    long mc_x23;   /* offset  40 */
    long mc_x24;   /* offset  48 */
    long mc_x25;   /* offset  56 */
    long mc_x26;   /* offset  64 */
    long mc_x27;   /* offset  72 */
    long mc_x28;   /* offset  80 */
    long mc_fp;    /* offset  88 — x29, frame pointer */
    long mc_lr;    /* offset  96 — x30, link register */
    long mc_sp;    /* offset 104 — stack pointer */
    long mc_pc;    /* offset 112 — program counter / jump target */
    long mc_spare[8];
};

struct ucontext {
    sigset_t         uc_sigmask;
    mctx             uc_mcontext;
    struct __ucontext *uc_link;
    stack_t          uc_stack;
    int              __spare__[8];
};

#ifdef __cplusplus
}
#endif
""")

          # Context.c — ARM64 makecontext / swapcontext
          with open(f'{platform}/Context.c', 'w') as f:
              f.write("""\
#include <string.h>
#include "Context.h"

void
makecontext(uctx *ucp, void (*func)(void), intptr_t arg)
{
    long *sp;
    memset(&ucp->uc_mcontext, 0, sizeof(ucp->uc_mcontext));
    ucp->uc_mcontext.mc_x0 = (long)arg;
    sp = (long*)((char*)ucp->uc_stack.ss_sp + ucp->uc_stack.ss_size);
    sp = (long*)((uintptr_t)sp & ~15UL); /* 16-align */
    ucp->uc_mcontext.mc_sp = (long)sp;
    ucp->uc_mcontext.mc_pc = (long)func;
}

int
swapcontext(uctx *oucp, const uctx *ucp)
{
    if (getcontext(oucp) == 0)
        setcontext(ucp);
    return 0;
}
""")

          # asm.s — ARM64 _getmcontext / _setmcontext
          # Offsets match struct mcontext above.
          with open(f'{platform}/asm.s', 'w') as f:
              f.write("""\
.globl _getmcontext
_getmcontext:
    /* x0 = pointer to mcontext */
    stp x19, x20, [x0, #8]     /* mc_x19, mc_x20 */
    stp x21, x22, [x0, #24]    /* mc_x21, mc_x22 */
    stp x23, x24, [x0, #40]    /* mc_x23, mc_x24 */
    stp x25, x26, [x0, #56]    /* mc_x25, mc_x26 */
    stp x27, x28, [x0, #72]    /* mc_x27, mc_x28 */
    stp x29, x30, [x0, #88]    /* mc_fp,  mc_lr  */
    mov x1, sp
    str x1,  [x0, #104]        /* mc_sp */
    str x30, [x0, #112]        /* mc_pc = lr (resume address) */
    mov x1, #1
    str x1,  [x0, #0]          /* mc_x0 = 1 so restoration returns 1 */
    mov x0, #0                 /* first call returns 0 */
    ret

.globl _setmcontext
_setmcontext:
    /* x0 = pointer to mcontext */
    ldr x1, [x0, #104]         /* mc_sp */
    ldr x2, [x0, #112]         /* mc_pc */
    ldp x19, x20, [x0, #8]
    ldp x21, x22, [x0, #24]
    ldp x23, x24, [x0, #40]
    ldp x25, x26, [x0, #56]
    ldp x27, x28, [x0, #72]
    ldp x29, x30, [x0, #88]    /* fp, lr */
    ldr x0,  [x0, #0]          /* mc_x0 — load last (base reg) */
    mov sp, x1
    br  x2
""")

          print("All ARM64 patches applied successfully.")
          EOF

      - name: Build
        id: build
        run: |
          export PATH="/opt/homebrew/opt/qt@5/bin:$PATH"
          build_folder="build/release"
          ccx_version=$(echo ${{ github.ref }} | sed 's|refs/tags/||')
          release_name="ccx-desktop-macOS-arm64-$ccx_version"
          app_name="conceal-desktop.app"

          lrelease src/languages/*.ts
          mkdir -p "$build_folder"
          cd "$build_folder"
          cmake ../.. -DCMAKE_BUILD_TYPE=Release -DBOOST_ROOT="$(brew --prefix boost)" -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)"
          make -j3
          macdeployqt "$app_name"
          cpack
          mkdir "$release_name"
          mv *.dmg "$release_name".dmg
          zip "$release_name".zip "$release_name".dmg
          sha256=$(shasum -a 256 "$release_name".zip | awk '{ print toupper($1) }')

          echo "sha256=${sha256}" >> $GITHUB_OUTPUT
          echo "release_name=${release_name}.zip" >> $GITHUB_OUTPUT
          echo "asset_path=${build_folder}/${release_name}.zip" >> $GITHUB_OUTPUT
          echo "ccx_version=${ccx_version}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.build.outputs.asset_path }}
          name: Conceal Desktop v${{ steps.build.outputs.ccx_version }}
          body: |
            [Download for macOS ARM64](../../releases/download/${{ steps.build.outputs.ccx_version }}/${{ steps.build.outputs.release_name }}) **${{ steps.build.outputs.release_name }}**
            `SHA256 : ${{ steps.build.outputs.sha256 }}`
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
